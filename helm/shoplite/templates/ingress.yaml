# catalog-api serves /products and /orders, so the /api prefix is stripped on the way in.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  labels: {{- include "shoplite.labels" "catalog-api" | nindent 4 }}
spec:
  stripPrefix:
    prefixes: [/api]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-api
  labels: {{- include "shoplite.labels" "catalog-api" | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entryPoint }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-strip-api@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: catalog-api, port: { name: http } } } }
      {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels: {{- include "shoplite.labels" "web" | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entryPoint }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
      {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
