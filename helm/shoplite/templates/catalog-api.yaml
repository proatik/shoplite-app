# its own identity, so EKS Pod Identity can give it AWS access without the nodes having any.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-api
  labels: {{- include "shoplite.labels" "catalog-api" | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  labels: {{- include "shoplite.labels" "catalog-api" | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: catalog-api }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels: {{- include "shoplite.labels" "catalog-api" | nindent 4 }}
spec:
  replicas: {{ .Values.catalogApi.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: catalog-api }
  template:
    metadata:
      labels: {{- include "shoplite.labels" "catalog-api" | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: catalog-api
      securityContext: {{- include "shoplite.podSecurity" 10001 | nindent 8 }}
      # db-init migrates and seeds under an advisory lock, so replicas starting together are safe.
      initContainers:
        - name: db-init
          image: {{ include "shoplite.image" (dict "root" $ "service" "catalog-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [scripts/db-init.js]
          env: {{- include "shoplite.postgresEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.catalogApi.resources | nindent 12 }}
          securityContext: {{- include "shoplite.containerSecurity" . | nindent 12 }}
      containers:
        - name: catalog-api
          image: {{ include "shoplite.image" (dict "root" $ "service" "catalog-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: catalog-api-config }
          env: {{- include "shoplite.postgresEnv" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {{- toYaml .Values.catalogApi.resources | nindent 12 }}
          securityContext: {{- include "shoplite.containerSecurity" . | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-api
  labels: {{- include "shoplite.labels" "catalog-api" | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: catalog-api }
