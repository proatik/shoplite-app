{{- if .Values.backup.enabled }}
# the nightly backup on the control plane uses this account; it may only read postgres-0 and exec into it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  labels: {{- include "shoplite.labels" "postgres" | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-token
  labels: {{- include "shoplite.labels" "postgres" | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: postgres-backup
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-backup
  labels: {{- include "shoplite.labels" "postgres" | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [pods]
    resourceNames: [postgres-0]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec]
    resourceNames: [postgres-0]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup
  labels: {{- include "shoplite.labels" "postgres" | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-backup
subjects:
  - kind: ServiceAccount
    name: postgres-backup
{{- end }}
