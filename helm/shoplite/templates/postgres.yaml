apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "shoplite.labels" "postgres" | nindent 4 }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "shoplite.labels" "postgres" | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: {{- include "shoplite.labels" "postgres" | nindent 8 }}
    spec:
      securityContext: {{- include "shoplite.podSecurity" 70 | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.database.user }} }
            - { name: POSTGRES_DB, value: {{ .Values.database.name }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: password }
            # a subdirectory, because the volume root holds lost+found on some storage.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.database.user }}, -d, {{ .Values.database.name }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.database.user }}]
            periodSeconds: 15
            failureThreshold: 4
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "shoplite.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: {{ .Values.database.storage }} }
