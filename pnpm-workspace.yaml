packages:
  - 'services/*'
  - 'packages/*'
allowBuilds:
  '@swc/core': false
  esbuild: true
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
# types-only package published before npm provenance existed; every @types/node 22 release depends on it.
trustPolicyExclude:
  - undici-types@6.21.0
