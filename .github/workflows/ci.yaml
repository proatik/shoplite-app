name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

# a newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  # helm 3, the major version argo cd renders charts with.
  HELM_IMAGE: alpine/helm:3.22.1@sha256:8191701ad1f82ee3695c87211fcbfe6d7b1bb7df92ac1c8de9ccdb0995a6a2c1
  TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
  SERVICES: catalog-api order-worker web
  MAX_IMAGE_BYTES: '150000000'

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      api: ${{ steps.compute.outputs.api }}
      worker: ${{ steps.compute.outputs.worker }}
      web: ${{ steps.compute.outputs.web }}
      images: ${{ steps.compute.outputs.images }}
      terraform: ${{ steps.compute.outputs.terraform }}
      ansible: ${{ steps.compute.outputs.ansible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # workspace, lockfile and workflow changes touch everything, as does an unknown base commit.
      - name: work out which parts this change touches
        id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$base" HEAD)
          else
            files="everything"
          fi
          touched() {
            [ "$files" = "everything" ] && return 0
            printf '%s\n' "$files" | grep -Eq "^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|\.github/|$1)"
          }
          flag() { if touched "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          flag packages 'packages/'
          flag api 'services/catalog-api/|packages/'
          flag worker 'services/order-worker/|packages/'
          flag web 'services/web/'
          flag images 'services/|packages/|docker-compose.yml|\.dockerignore|Makefile|scripts/'
          flag terraform 'terraform/'
          flag ansible 'ansible/|linux/'
          cat "$GITHUB_OUTPUT"

  lint:
    name: Format, typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          save-cache: 'true'
      - run: pnpm format:check
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run lint
      # trivy cannot read the pnpm 12 lockfile, so the npm advisory database checks the bundled dependencies.
      - run: pnpm audit --prod --audit-level critical
      - name: hadolint every dockerfile
        run: |
          for service in $SERVICES; do
            echo "services/$service/Dockerfile"
            docker run --rm -i "$HADOLINT_IMAGE" < "services/$service/Dockerfile"
          done
      # the release sets the image tag, so lint supplies a placeholder for the required value.
      # monitoring and the canary, which needs it, add their own templates, so the chart is linted
      # with both off and both on.
      - name: helm lint the chart
        run: |
          for monitoring in false true; do
            docker run --rm -v "$PWD/helm:/charts" "$HELM_IMAGE" lint --strict /charts/shoplite \
              --set image.tag=lint --set monitoring.enabled="$monitoring" \
              --set catalogApi.canary.enabled="$monitoring"
          done
      - name: build the dashboard manifests
        run: kubectl kustomize monitoring/dashboards > /dev/null

  # each test job runs vitest once and writes a single result line into its summary.
  shared:
    name: Shared package tests
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @shoplite/shared exec vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
      - if: always()
        run: node .github/scripts/test-summary.mjs "$RUNNER_TEMP/vitest.json"

  api:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # throwaway datastores matching the local defaults the test setup falls back to.
    services: &datastores
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: shoplite
          POSTGRES_PASSWORD: shoplite-local
          POSTGRES_DB: shoplite
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U shoplite" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      # one run covers both the unit and the integration project.
      - run: pnpm --filter catalog-api exec vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
      - if: always()
        run: node .github/scripts/test-summary.mjs "$RUNNER_TEMP/vitest.json"

  worker:
    name: Worker tests
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services: *datastores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter order-worker exec vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
      - if: always()
        run: node .github/scripts/test-summary.mjs "$RUNNER_TEMP/vitest.json"

  web:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter web exec vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
      - if: always()
        run: node .github/scripts/test-summary.mjs "$RUNNER_TEMP/vitest.json"

  # every check reports even when an earlier one fails, so the pull-request comment shows them all.
  terraform:
    name: Terraform checks and plan
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - id: fmt
        run: terraform fmt -check -recursive
      - id: validate
        if: ${{ !cancelled() }}
        run: |
          for root in envs/aws state; do
            terraform -chdir="$root" init -backend=false -input=false > /dev/null
            terraform -chdir="$root" validate -no-color
          done
      - id: tflint
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
      # accepted findings are ignored inline, each above its resource with the reason.
      - id: trivy
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/tf:ro" "$TRIVY_IMAGE" config --severity HIGH,CRITICAL --exit-code 1 --skip-version-check --quiet /tf

      # a lab session sets these variables from the github_variables output; until then the plan is skipped.
      - if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: plan
        if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
        env:
          TF_IN_AUTOMATION: 'true'
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_ssh_public_key: ${{ vars.TF_SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key_path: ${{ vars.TF_SSH_PRIVATE_KEY_PATH }}
          TF_VAR_budget_email: ${{ vars.TF_BUDGET_EMAIL }}
          TF_VAR_admin_access: ${{ vars.TF_ADMIN_ACCESS }}
          TF_VAR_admin_cidr: ${{ vars.TF_ADMIN_CIDR }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        # the role may only read, so the plan runs without taking the state lock.
        run: |
          terraform -chdir=envs/aws init -reconfigure -input=false             -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION" > /dev/null
          terraform -chdir=envs/aws plan -lock=false -input=false -no-color > "$RUNNER_TEMP/plan.txt"

      - name: post the results on the pull request
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESULTS: >-
            fmt=${{ steps.fmt.outcome }} validate=${{ steps.validate.outcome }}
            tflint=${{ steps.tflint.outcome }} trivy=${{ steps.trivy.outcome }}
            plan=${{ steps.plan.outcome }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          {
            echo '### Terraform'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            for result in $RESULTS; do
              case "${result#*=}" in
                success) icon='✅ passed' ;;
                skipped) icon='⏭️ skipped' ;;
                *) icon='❌ failed' ;;
              esac
              echo "| ${result%%=*} | $icon |"
            done
            echo
            if [ -s "$RUNNER_TEMP/plan.txt" ]; then
              echo '<details><summary>Plan</summary>'
              echo
              echo '```text'
              head -c 60000 "$RUNNER_TEMP/plan.txt"
              echo '```'
              echo '</details>'
            else
              echo 'The plan runs once a lab session sets the AWS repository variables, as terraform/README.md describes.'
            fi
          } > "$body"
          gh pr comment "$PR" --edit-last --body-file "$body" || gh pr comment "$PR" --body-file "$body"

  # the container test in ansible/test runs locally; it needs about 15 minutes of privileged systemd nodes.
  ansible:
    name: Ansible and shell checks
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the pinned ansible tools
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet ansible-core==2.21.6 ansible-lint==26.10.1
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: ansible-lint
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yaml > /dev/null
          ansible-lint
      - name: shellcheck the scripts
        if: ${{ !cancelled() }}
        run: shellcheck --severity=warning linux/bin/* linux/firewall/ufw.sh ansible/test/run.sh

  # runs alongside lint and the tests; only publishing waits for them.
  images:
    name: Build, scan and smoke-test images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # bake builds the three compose images in parallel and keeps their layers in the actions cache.
      - name: build the images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: docker-compose.yml
          load: true
          set: |
            catalog-api.cache-from=type=gha,scope=catalog-api
            catalog-api.cache-to=type=gha,scope=catalog-api,mode=max
            order-worker.cache-from=type=gha,scope=order-worker
            order-worker.cache-to=type=gha,scope=order-worker,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max

      - name: tag the images with the short commit sha
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          for service in $SERVICES; do
            docker tag "shoplite/$service:local" "shoplite/$service:${GITHUB_SHA::7}"
          done

      - name: every image stays under 150 MB
        run: |
          for service in $SERVICES; do
            size=$(docker image inspect --format '{{.Size}}' "shoplite/$service:$TAG")
            echo "$service: $size bytes"
            [ "$size" -lt "$MAX_IMAGE_BYTES" ] || { echo "$service is over 150 MB"; exit 1; }
          done

      # the vulnerability database is downloaded at most once a day and shared by all three scans.
      - id: day
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - id: trivy-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.date }}
          restore-keys: trivy-db-
      # trivy runs as the runner user, so the cache it writes can be saved for the next run.
      - name: fail on critical vulnerabilities
        run: |
          mkdir -p "$HOME/.cache/trivy"
          for service in $SERVICES; do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --group-add "$(stat -c %g /var/run/docker.sock)" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/cache" \
              "$TRIVY_IMAGE" image --cache-dir /cache --scanners vuln --severity CRITICAL --exit-code 1 --skip-version-check --no-progress "shoplite/$service:$TAG"
          done
      - if: steps.trivy-db.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ steps.trivy-db.outputs.cache-primary-key }}

      # the stack starts from the images built above, so the smoke test checks exactly what ships.
      - name: start the stack and place an order end to end
        run: |
          docker compose up -d --wait --no-build
          make smoke
      - if: failure()
        run: docker compose logs --no-color --tail 100

  # rebuilt from the layer cache the images job just wrote, so the pushed layers are the tested ones.
  publish:
    name: Publish images to ECR
    needs: [changes, lint, shared, api, worker, web, images]
    # a test job skipped because its part did not change still counts as passed.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' && needs.lint.result == 'success' && needs.images.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: docker-compose.yml
          load: true
          set: |
            catalog-api.cache-from=type=gha,scope=catalog-api
            order-worker.cache-from=type=gha,scope=order-worker
            web.cache-from=type=gha,scope=web
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: push the images tagged with the short commit sha
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for service in $SERVICES; do
            image="$REGISTRY/shoplite/$service:${GITHUB_SHA::7}"
            docker tag "shoplite/$service:local" "$image"
            docker push "$image"
          done

  # ci never runs kubectl: it commits the new tag to shoplite-gitops, and argo cd rolls dev out.
  release:
    name: Release to dev through GitOps
    needs: publish
    # always() keeps a skipped test job further up the chain from skipping the release.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: gitops-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: proatik/shoplite-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - name: point dev at the new images
        env:
          REGISTRY: ${{ needs.publish.outputs.registry }}
        run: |
          tag=${GITHUB_SHA::7}
          REGISTRY=$REGISTRY TAG=$tag yq -i '.image.registry = strenv(REGISTRY) | .image.tag = strenv(TAG)' envs/dev/values.yaml
          if git diff --quiet; then
            echo "dev already runs $tag"
            exit 0
          fi
          git config user.name shoplite-ci
          git config user.email ci@shoplite.invalid
          git commit -am "chore(release): deploy $tag to dev"
          git push
