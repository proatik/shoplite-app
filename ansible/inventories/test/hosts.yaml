all:
  vars:
    ansible_host: 127.0.0.1
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.cache/shoplite-ansible/id_ed25519
    # throwaway test containers get new host keys on every run
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  children:
    k3s_server:
      hosts:
        server: { ansible_port: 2201 }
    k3s_agents:
      hosts:
        agent: { ansible_port: 2202 }
