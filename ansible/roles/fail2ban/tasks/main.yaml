- name: Install fail2ban with its systemd journal backend
  ansible.builtin.apt:
    name: [fail2ban, python3-systemd]

- name: Ban addresses that keep failing ssh logins
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: '0644'
  notify: Restart fail2ban

- name: Run fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
