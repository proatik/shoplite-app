<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Fira Code, Consolas, monospace">
  <title>ShopLite on AWS: architecture</title>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6cb6ff"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ac26b"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker>
    <style>
      .zone { fill: none; stroke: #3a4656; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .zone-label { fill: #9aa6b4; font-size: 11.5px; font-weight: 600; letter-spacing: 1px; }
      .box { fill: #151b23; stroke: #3a4656; stroke-width: 1.2; }
      .name { fill: #f0f3f6; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #9aa6b4; font-size: 11.5px; text-anchor: middle; }
      .edge-label { fill: #c4cdd8; font-size: 11px; }
      .req { stroke: #6cb6ff; stroke-width: 1.6; fill: none; marker-end: url(#blue); }
      .dlv { stroke: #4ac26b; stroke-width: 1.6; fill: none; marker-end: url(#green); }
      .tel { stroke: #e3b341; stroke-width: 1.6; fill: none; marker-end: url(#amber); stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#0d1117"/>

  <!-- outside aws -->
  <rect class="box" x="40" y="24" width="200" height="60" rx="4"/>
  <text class="name" x="140" y="50">GitHub Actions</text>
  <text class="sub" x="140" y="68">test · scan · build</text>
  <rect class="box" x="270" y="24" width="180" height="60" rx="4"/>
  <text class="name" x="360" y="50">shoplite-gitops</text>
  <text class="sub" x="360" y="68">desired state</text>
  <rect class="box" x="520" y="24" width="160" height="60" rx="4"/>
  <text class="name" x="600" y="50">Customer</text>
  <text class="sub" x="600" y="68">browser</text>
  <rect class="box" x="960" y="24" width="200" height="60" rx="4"/>
  <text class="name" x="1060" y="50">Slack</text>
  <text class="sub" x="1060" y="68">alert channel</text>

  <!-- aws and vpc -->
  <rect class="zone" x="24" y="112" width="1152" height="632" rx="6"/>
  <text class="zone-label" x="320" y="134">AWS CLOUD · AP-SOUTHEAST-1</text>
  <rect class="box" x="40" y="148" width="200" height="56" rx="4"/>
  <text class="name" x="140" y="172">Amazon ECR</text>
  <text class="sub" x="140" y="190">3 image repositories</text>

  <rect class="zone" x="40" y="224" width="1120" height="504" rx="6"/>
  <text class="zone-label" x="320" y="246">VPC · TWO AVAILABILITY ZONES</text>

  <rect class="zone" x="56" y="256" width="1088" height="84" rx="4"/>
  <text class="zone-label" x="72" y="276">PUBLIC SUBNETS</text>
  <rect class="box" x="520" y="272" width="160" height="56" rx="4"/>
  <text class="name" x="600" y="296">ALB</text>
  <text class="sub" x="600" y="314">ports 80 · 8080</text>
  <rect class="box" x="760" y="272" width="150" height="56" rx="4"/>
  <text class="name" x="835" y="296">Bastion</text>
  <text class="sub" x="835" y="314">admin SSH</text>
  <rect class="box" x="930" y="272" width="110" height="56" rx="4"/>
  <text class="name" x="985" y="296">NAT</text>
  <text class="sub" x="985" y="314">egress</text>

  <rect class="zone" x="56" y="356" width="1088" height="356" rx="4"/>
  <text class="zone-label" x="72" y="376">PRIVATE SUBNETS · K3S CLUSTER</text>

  <rect class="box" x="520" y="388" width="160" height="48" rx="4"/>
  <text class="name" x="600" y="409">Traefik</text>
  <text class="sub" x="600" y="426">ingress</text>

  <rect class="box" x="96" y="470" width="220" height="52" rx="4"/>
  <text class="name" x="206" y="492">Argo CD</text>
  <text class="sub" x="206" y="510">dev auto · prod manual</text>

  <!-- namespace shoplite -->
  <rect class="zone" x="340" y="452" width="520" height="244" rx="4"/>
  <text class="zone-label" x="356" y="472">NAMESPACE SHOPLITE</text>
  <rect class="box" x="364" y="484" width="160" height="48" rx="4"/>
  <text class="name" x="444" y="505">web</text>
  <text class="sub" x="444" y="522">nginx · 2 replicas</text>
  <rect class="box" x="676" y="484" width="160" height="48" rx="4"/>
  <text class="name" x="756" y="505">catalog-api</text>
  <text class="sub" x="756" y="522">2 replicas · PDB</text>
  <rect class="box" x="676" y="556" width="160" height="48" rx="4"/>
  <text class="name" x="756" y="577">Redis</text>
  <text class="sub" x="756" y="594">orders:pending</text>
  <rect class="box" x="364" y="628" width="160" height="48" rx="4"/>
  <text class="name" x="444" y="649">PostgreSQL</text>
  <text class="sub" x="444" y="666">StatefulSet · PVC</text>
  <rect class="box" x="676" y="628" width="160" height="48" rx="4"/>
  <text class="name" x="756" y="649">order-worker</text>
  <text class="sub" x="756" y="666">HPA 1–4</text>

  <!-- namespace monitoring -->
  <rect class="zone" x="884" y="452" width="236" height="244" rx="4"/>
  <text class="zone-label" x="900" y="472">NAMESPACE MONITORING</text>
  <rect class="box" x="904" y="484" width="196" height="40" rx="4"/>
  <text class="name" x="1002" y="501">Prometheus</text>
  <text class="sub" x="1002" y="516">+ Alertmanager</text>
  <rect class="box" x="904" y="534" width="196" height="40" rx="4"/>
  <text class="name" x="1002" y="551">Loki</text>
  <text class="sub" x="1002" y="566">logs via Alloy</text>
  <rect class="box" x="904" y="584" width="196" height="40" rx="4"/>
  <text class="name" x="1002" y="601">Tempo</text>
  <text class="sub" x="1002" y="616">OTLP traces</text>
  <rect class="box" x="904" y="634" width="196" height="40" rx="4"/>
  <text class="name" x="1002" y="651">Grafana</text>
  <text class="sub" x="1002" y="666">served at /grafana</text>

  <!-- request flow -->
  <path class="req" d="M600 84V270"/>
  <path class="req" d="M600 328V386"/>
  <path class="req" d="M568 436L478 482"/>
  <path class="req" d="M632 436L722 482"/>
  <text class="edge-label" x="482" y="456">/</text>
  <text class="edge-label" x="694" y="456">/api</text>
  <path class="req" d="M756 532V554"/>
  <path class="req" d="M756 604V626"/>
  <path class="req" d="M676 524L526 636"/>
  <path class="req" d="M676 652H526"/>

  <!-- delivery flow -->
  <path class="dlv" d="M240 54H268"/>
  <path class="dlv" d="M140 84V146"/>
  <text class="edge-label" x="150" y="104">push · OIDC</text>
  <path class="dlv" d="M300 84V468"/>
  <path class="dlv" d="M316 496H338"/>

  <!-- telemetry -->
  <path class="tel" d="M860 580H902"/>
  <path class="tel" d="M1060 484V86"/>

  <!-- legend -->
  <path class="req" d="M40 772H80"/>
  <text class="edge-label" x="92" y="776">request</text>
  <path class="dlv" d="M200 772H240"/>
  <text class="edge-label" x="252" y="776">delivery</text>
  <path class="tel" d="M370 772H410"/>
  <text class="edge-label" x="422" y="776">telemetry · alerts</text>
</svg>
